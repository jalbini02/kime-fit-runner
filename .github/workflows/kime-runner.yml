name: KIME FIT runner

# Every 30 minutes, all day and night. GitHub may start a run a few minutes late; that's normal.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

concurrency:
  group: kime-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-1.47.2
      - run: npm install --no-save --no-audit --no-fund playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - name: Open the CRM and let it run its automations
        run: node run.mjs
        env:
          KIME_RUNNER_KEY: ${{ secrets.KIME_RUNNER_KEY }}
          KIME_STAFF_KEY: ${{ secrets.KIME_STAFF_KEY }}
          CRM_SITE_PASSWORD: ${{ secrets.CRM_SITE_PASSWORD }}
          CRM_URL: ${{ vars.CRM_URL }}
